# Et Al.: a research room with three agents on two models.
#
# Follows the format of examples/agent-templates/triage-pair.template.yaml in
# the Switch repo (language: docs/TEMPLATES.md).
#
# Don't import this file directly. Run .\scripts\fill-local.ps1 first: it
# replaces the placeholders and each "#include" line with the matching file
# from agents\ and room\, and writes the result to local\templates\. Import
# that copy in Switch Console: Templates, then Import template.
#
# Before running it: remove any existing coordinator, scout and experimenter
# agents (names must be free), and make sure Cursor and Claude Code are both
# installed and signed in under Settings, Agent Providers.
version: 1

params:
  room_name:
    type: string
    label: Room name
    description: Use a new name each run; archived rooms may keep theirs.
    default: research-room
    pattern: "[a-z][a-z0-9-]*"
  location:
    type: location
    description: The machine all three agents run on.
    default: local
    input: advanced
  directory:
    type: directory
    description: Each agent's working directory, inside the repo's workspace folder.
    default: "WORKSPACE-DIR/{agent}"
    input: advanced
  bridge:
    type: bridge
    description: Where the room is mirrored. The server's default app (Mattermost) is chosen.
    default: [$first]

agents:
  - name: "coordinator"
    description: Plans the project and keeps its documents
    addressing: anyone
    provider: cursor
    # model: set the Grok model in Console after import (agent, Advanced Configuration)
    location: "{location}"
    directory: "{directory}"
    auto_approve: true
    instructions: |
      #include agents/coordinator.md
  - name: "scout"
    description: Finds and digs into research papers
    addressing: anyone
    provider: cursor
    # model: set the Grok model in Console after import (agent, Advanced Configuration)
    location: "{location}"
    directory: "{directory}"
    auto_approve: true
    instructions: |
      #include agents/scout.md
  - name: "experimenter"
    description: Writes, runs, and debugs experiments following the methodology
    addressing: anyone
    provider: claude
    model: sonnet
    location: "{location}"
    directory: "{directory}"
    auto_approve: true
    instructions: |
      #include agents/experimenter.md

# The room is created on the messaging app the `bridge` input names.
# {$creator} (you, the PI) and the student account join it.
room:
  name: "{room_name}"
  description: "Research team room: PI, student, coordinator, scout and experimenter agents."
  bridge: "{bridge}"
  instructions: |
    #include room/instructions.md
  agents: ["coordinator", "scout", "experimenter"]
  users: ["{$creator}", "STUDENT-USERNAME"]

kickoff: |
  @coordinator, @scout and @experimenter: this is the research room. Reply with one line saying you're ready, then wait for the PI's first message.
